# Authoritative risk limits. Percentages are fractions of the relevant
# equity reference (0.005 = 0.50%). Changing these is a deliberate,
# version-controlled human decision — never automatic.

reference_equity: 20000.00            # hypothetical starting equity

per_trade_risk_pct: 0.005             # 0.50% of start-of-day equity
aggregate_planned_risk_pct: 0.025     # 2.50% across open trades
daily_loss_limit_pct: 0.015           # 1.50% of start-of-day equity, plus the planned max loss of any open multi-day position
daily_profit_stop_pct: 0.05           # 5.00% ceiling, not a target
drawdown_warning_pct: 0.05            # 5% below equity high-water mark
drawdown_shutdown_pct: 0.10           # 10% below equity high-water mark

max_concurrent_positions: 3
preferred_concurrent_positions: 2

take_profit_pct_of_risk: 0.20         # 20% of capital at risk in the trade

allow_uncovered_short_options: false
allow_overnight_positions: true       # owner decision 2026-10-19: multi-day positions may be held overnight (refused in live)
allow_auto_risk_increase: false
allow_autonomous_strategy_changes: false

# --- Exits (every position gets this plan before entry) ---------------------
stop_loss_pct_of_max_loss: 0.50       # close when the loss reaches 50% of the trade's max loss
max_holding_minutes: 120              # time exit
mispricing_exit_z: 0.5                # close when the original mispricing has mostly disappeared

# --- Portfolio exposure limits ---------------------------------------------
max_net_delta_pct: 0.50               # |SPY-equivalent delta| x price, as a fraction of equity
max_net_vega_pct: 0.0025              # $ per 1 vol point, as a fraction of equity
underlying_betas: {SPY: 1.0, QQQ: 1.2}   # correlation: exposure is measured in SPY terms
stress_loss_pct_of_daily_allowance: 1.0  # worst historical stress loss may use at most this share of today's remaining loss allowance

# --- Hedging ----------------------------------------------------------------
allow_stock_hedge: true               # SPY shares may be used to bring delta back inside limits
max_hedge_shares: 30

# --- Kill switch ---------------------------------------------------------------
max_quote_age_with_positions_seconds: 60   # market data older than this while holding positions = emergency
max_consecutive_execution_failures: 3
approval_valid_seconds: 30            # a risk approval expires; each order needs a fresh one

# --- Multi-day strategy (owner decisions 2026-10-19, paper trading) ---------------
# Only positions opened by a multi-day strategy may be held overnight; every other
# position still closes the same day. These limits form their own risk pool.
multiday:
  per_trade_risk_pct: 0.03            # up to 3% of start-of-day equity may be lost on one multi-day trade
  max_open_positions: 1
  close_days_before_expiry: 7         # never hold into an option's final week (assignment and pin risk)
  assignment_extrinsic_threshold: 0.05  # $/share: a short leg in the money with less time value than this is closed
  dividend_estimate: 1.90             # $/share, SPY quarterly dividend estimate (early-assignment check)
  ex_dividend_dates: []               # explicit SPY ex-dividend dates (YYYY-MM-DD); empty = third Friday of Mar/Jun/Sep/Dec
  open_settle_minutes: 5              # after the open, wait this long for fresh quotes before acting on held positions
  gap_exit_slack: 0.25                # $/share extra allowed when closing a position that gapped past its stop
