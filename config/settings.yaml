# Base settings shared by every environment.
# Environment files in config/environments/ override these values.
# Risk limits live separately in risk_limits.yaml.

app:
  name: options-quant
  timezone: America/New_York

# Trading is OFF by default. Phase 1 has no order-submission code at all;
# this flag exists so later phases have one authoritative switch.
trading:
  enabled: false
  allow_order_submission: false

broker:
  name: alpaca
  # "paper" or "live". Must match the environment (see core/config.py).
  account_type: paper

market_data:
  primary_underlying: SPY
  additional_underlyings: []          # QQQ etc. later
  stock_feed: iex                     # free feed; "sip" needs a paid plan
  option_feed: indicative             # "opra" needs a paid plan
  poll_interval_seconds: 15
  min_days_to_expiry: 7
  max_days_to_expiry: 30
  strike_band_pct: 0.10               # only collect strikes within ±10% of the underlying price
  contracts_refresh_minutes: 60
  max_consecutive_failures: 20       # collector stops after this many failed cycles in a row

data_quality:
  max_quote_age_seconds: 60           # older than this at receipt = stale
  max_clock_skew_seconds: 5           # quote stamped this far in the future = bad timestamp
  max_relative_spread: 0.25           # (ask-bid)/mid above this = too wide...
  min_absolute_spread_for_wide: 0.05  # ...but only if the spread is also at least this many dollars

pricing:
  rate_series: [DGS1MO, DGS3MO]       # free daily US Treasury yields from FRED
  fallback_risk_free_rate: 0.04       # used only if no stored rate (logged as a warning)
  max_rate_age_days: 7
  snapshot_max_quote_age_seconds: 60  # quotes older than this at snapshot time are ignored
  forward_pairs: 6                    # call/put pairs nearest the money used for the implied forward
  surface_poly_degree: 3              # smile = polynomial in log-moneyness, per expiry
  min_points_per_expiry: 8
  outlier_mad_threshold: 4.0          # drop fit points this many robust std-devs from the smile
  american_crr_steps: 200
  early_exercise_flag_threshold: 0.02 # $/share; above this, Black-Scholes is flagged unreliable
  min_option_price: 0.10              # below this, tick size dominates the implied vol: not trusted
  parity_check_moneyness: 0.03        # parity checked only within ±3% of the forward (early exercise distorts it further out)
  model_vol_uncertainty_floor: 0.0025 # 0.25 vol points of model error added to every fair value

schedule:                             # Eastern time, HH:MM
  scan_start: "09:35"
  no_new_positions_after: "15:00"
  begin_closing: "15:30"
  target_flat_by: "15:45"

storage:
  sqlite_path: data/storage/options_quant.db

logging:
  level: INFO
  directory: logs
  json_file: options_quant.jsonl
